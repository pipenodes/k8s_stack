---
fullnameOverride: development-loki
loki:
  auth_enabled: false
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.5.1  
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    bucketNames:
      chunks: grafana-loki-dev-goapice-com
      ruler: grafana-loki-ruler-dev-goapice-com
      admin: grafana-loki-admin-dev-goapice-com
    type: s3
    s3:
      region: us-east-1        
  ingester:
    chunk_encoding: snappy
  compactor:
    retention_enabled: true
    delete_request_store: s3
  server:
    http_server_read_timeout: 5m
    http_server_write_timeout: 5m      
  pattern_ingester:
    enabled: true  
  tracing:
    enabled: true
    type: otlp
    otlp:
      grpc:
        endpoint: http://opentelemetry-collector.development-workload-vault.svc.cluster.local:4317
      http:
        endpoint: http://opentelemetry-collector.development-workload-vault.svc.cluster.local:4318
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 2
    query_ingesters_within: 3h
  query_range:
    cache_results: true
    max_retries: 5
    cache_index_stats_results: true
    instant_metric_query_split_align: true
  storage_config:
    hedging:
      at: 250ms
      max_per_second: 20
      up_to: 3
  chunk_store_config:
    chunk_cache_config:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 1GB
        ttl: 24h
    write_dedupe_cache_config:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 1GB
        ttl: 24h
  limits_config:
    retention_period: 72h # -- 7 dias de retenção dos logs
    max_global_streams_per_user: 5000
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    allow_structured_metadata: true
    split_queries_by_interval: 15m
    volume_enabled: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label        
            attributes:
              - service.environment

#gateway:
#  ingress:
#    enabled: true
#    hosts:
#      - host: FIXME
#        paths:
#          - path: /
#            pathType: Prefix

deploymentMode: SimpleScalable

gateway:
  replicas: 2
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0

chunksCache:
  enabled: true
  allocatedMemory: 4096
  writebackSizeLimit: 1GB
  writebackGoroutines: 20

resultsCache:
  enabled: true
  allocatedMemory: 1024
  writebackSizeLimit: 500MB
  writebackGoroutines: 10

indexCache:
  enabled: true
  allocatedMemory: 2048
  writebackSizeLimit: 500MB


# optional experimental components
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# Enable minio for storage
minio:
  enabled: false

# Zero out replica counts of other deployment modes
backend:
  replicas: 2
  persistence:
    volumeClaimsEnabled: true
    dataVolumeParameters:
      emptyDir: {}
    size: 5Gi
    storageClass: local-path
read:
  replicas: 2
  persistence:
    enableStatefulSetAutoDeletePVC: true
    size: 5Gi
    storageClass: local-path
write:
  replicas: 2
  persistence:
    enableStatefulSetAutoDeletePVC: true
    size: 5Gi
    storageClass: local-path

singleBinary:
  replicas: 0
test:
  enabled: false
lokiCanary:
  enabled: false    
