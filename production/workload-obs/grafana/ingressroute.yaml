apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: production-workload-obs
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`grafana-internal.dev.goapice.com`)
    services:
    - name: grafana
      port: 80
