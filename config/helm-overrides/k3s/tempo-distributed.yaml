# Affinity em string: o chart aplica `tpl` ao valor (não aceita mapa cru como outros charts).
x_cp_affinity_str: &cp_affinity_str |
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
x_cp_tol: &cp_tol
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

ingester:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
metricsGenerator:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
distributor:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
compactor:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
querier:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
queryFrontend:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
gateway:
  affinity: *cp_affinity_str
  tolerations: *cp_tol
