x_cp_affinity: &cp_affinity
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
x_cp_tol: &cp_tol
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

alertmanager:
  alertmanagerSpec:
    affinity: *cp_affinity
    tolerations: *cp_tol
prometheusOperator:
  affinity: *cp_affinity
  tolerations: *cp_tol
  admissionWebhooks:
    patch:
      affinity: *cp_affinity
      tolerations: *cp_tol
prometheus:
  prometheusSpec:
    affinity: *cp_affinity
    tolerations: *cp_tol
thanosRuler:
  thanosRulerSpec:
    affinity: *cp_affinity
    tolerations: *cp_tol
grafana:
  affinity: *cp_affinity
  tolerations: *cp_tol
