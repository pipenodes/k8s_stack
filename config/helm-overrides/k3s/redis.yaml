x_cp_ns: &cp_ns
  node-role.kubernetes.io/control-plane: ""
x_cp_tol: &cp_tol
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
master:
  nodeSelector: *cp_ns
  tolerations: *cp_tol
replica:
  nodeSelector: *cp_ns
  tolerations: *cp_tol
